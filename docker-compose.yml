services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pawn2king
      POSTGRES_PASSWORD: pawn2king_dev
      POSTGRES_DB: pawn2king
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:

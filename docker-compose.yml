services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pawn2king
      POSTGRES_PASSWORD: pawn2king_dev
      POSTGRES_DB: pawn2king
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawn2king"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://pawn2king:pawn2king_dev@postgres:5432/pawn2king?schema=public"
      REDIS_HOST: redis
      JWT_SECRET: "pawn2king-dev-secret-key-change-in-production"
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: "http://server:3001"
    volumes:
      - ./client/src:/app/src
    depends_on:
      - server

volumes:
  pgdata:
